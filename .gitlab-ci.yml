# svelte-excalidraw: npm publish + GitLab images + PROD on prod1
# Single compose: docker/prod/compose.yml → /docker/svex (see docker/prod/README.md)

stages:
  - build
  - publish
  - docker
  - deploy

variables:
  NPM_CONFIG_CACHE: "${CI_PROJECT_DIR}/.npm-cache"
  DOCS_IMAGE: $CI_REGISTRY_IMAGE/docs
  SVEX_IMAGE: $CI_REGISTRY_IMAGE/svex
  STACK_PROD_DIR: "/docker/svex"
  STACK_COMPOSE_SERVICES: "svex docs"
  INFRA_SRC: "docker/prod"

# cd STACK_DIR, login registry, compose pull/up all services (image vars from .env.deploy only)
.prod-compose-up:
  tags:
    - "name:runner0"
    - "exec:shell"
  script:
    - |
      set -eu
      cd "$STACK_DIR"
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      if [ -f docker-compose.yml ]; then
        COMPOSE_FILE=docker-compose.yml
      elif [ -f compose.yml ]; then
        COMPOSE_FILE=compose.yml
      else
        echo "ERROR: $STACK_DIR must contain docker-compose.yml or compose.yml"
        exit 1
      fi
      docker compose -f "$COMPOSE_FILE" --env-file .env.deploy pull $STACK_COMPOSE_SERVICES
      docker compose -f "$COMPOSE_FILE" --env-file .env.deploy up -d --remove-orphans $STACK_COMPOSE_SERVICES

# ----------------- BUILD -----------------
# Shell executor ignores `image:` — nvm + .nvmrc. better-sqlite3 >=12.8 ships node-v137 prebuilds (Node 24); older 11.x did not → node-gyp needed make on runner.
build:
  stage: build
  image: node:24
  tags:
    - "name:runner0"
    - "exec:shell"
  cache:
    key:
      files:
        - package-lock.json
      prefix: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm-cache
      - packages/svelte-excalidraw/dist
      - apps/docs/build
      - apps/docs/.svelte-kit
      - apps/svex/build
      - apps/svex/.svelte-kit
  before_script:
    - |
      cd "$CI_PROJECT_DIR"
      . $HOME/.nvm/nvm.sh
      nvm install
      nvm use
      npm ci
  script:
    - |
      cd "$CI_PROJECT_DIR"
      . $HOME/.nvm/nvm.sh
      nvm use
      npm run build
  artifacts:
    paths:
      - packages/svelte-excalidraw/dist
      - apps/docs/build
      - apps/svex/build
    expire_in: 1 day

# ----------------- PUBLISH (npm, public registry) -----------------
# Only on release tags — not on every main push (avoids "version already exists").
# Flow: bump packages/svelte-excalidraw version on main → tag → push tag:
#   git tag v0.0.9 && git push origin v0.0.9
# Requires NPM_TOKEN. Tag pipeline runs build + this job (no docker/deploy unless you add tag rules).
publish-npm-release:
  stage: publish
  image: node:24
  tags:
    - "name:runner0"
    - "exec:shell"
  needs: [build]
  before_script:
    - |
      cd "$CI_PROJECT_DIR"
      . $HOME/.nvm/nvm.sh
      nvm install
      nvm use
      npm ci
  script:
    - |
      cd "$CI_PROJECT_DIR"
      . $HOME/.nvm/nvm.sh
      nvm use
      echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
      npm publish -w svelte-excalidraw --access public
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+(-.+)?$/ # e.g. v0.0.9 or 0.0.9

# dev → GitLab Package Registry (tag dev). Uses CI_JOB_TOKEN.
publish-npm-dev:
  stage: publish
  image: node:24
  tags:
    - "name:runner0"
    - "exec:shell"
  needs: [build]
  before_script:
    - |
      cd "$CI_PROJECT_DIR"
      . $HOME/.nvm/nvm.sh
      nvm install
      nvm use
      npm ci
  script:
    - |
      cd "$CI_PROJECT_DIR"
      . $HOME/.nvm/nvm.sh
      nvm use
      echo "registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/" >> .npmrc
      echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
      npm publish -w svelte-excalidraw --access public --tag dev
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ----------------- DOCKER (GitLab registry only) -----------------
.docker-build:
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  tags:
    - "name:runner0"
    - "exec:shell"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build-docker-docs:
  extends: .docker-build
  stage: docker
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - docker build -t $DOCS_IMAGE:$CI_COMMIT_SHA -t $DOCS_IMAGE:$CI_COMMIT_REF_SLUG -f apps/docs/Dockerfile .
    - docker push $DOCS_IMAGE:$CI_COMMIT_SHA
    - docker push $DOCS_IMAGE:$CI_COMMIT_REF_SLUG

build-docker-svex:
  extends: .docker-build
  stage: docker
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - docker build -t $SVEX_IMAGE:$CI_COMMIT_SHA -t $SVEX_IMAGE:$CI_COMMIT_REF_SLUG -f apps/svex/Dockerfile .
    - docker push $SVEX_IMAGE:$CI_COMMIT_SHA
    - docker push $SVEX_IMAGE:$CI_COMMIT_REF_SLUG

# ----------------- DEPLOY (PROD / main only) -----------------
# One compose on prod; `compose up -d` only recreates a service when its image/config actually changes.

📦@svelte-excalidraw/PROD/_prepare:
  stage: deploy
  tags:
    - "name:runner0"
    - "exec:shell"
  needs: [build-docker-docs, build-docker-svex]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: PROD/svelte-excalidraw
    url: https://svex.tips.dev/
    action: prepare
  script:
    - test -d "$CI_PROJECT_DIR/$INFRA_SRC" || (echo "Missing $INFRA_SRC" && exit 1)
    - test -f "$CI_PROJECT_DIR/$INFRA_SRC/compose.yml" || (echo "Missing $INFRA_SRC/compose.yml" && exit 1)
    - mkdir -p "$STACK_PROD_DIR"
    - |
      if command -v rsync >/dev/null 2>&1; then
        rsync -av "$CI_PROJECT_DIR/$INFRA_SRC/" "$STACK_PROD_DIR/" \
          --exclude 'data' --exclude '.env.deploy' \
          --exclude '*.sqlite' --exclude '*.sqlite-*'
      else
        echo "rsync not found; copying compose.yml only"
        cp -f "$CI_PROJECT_DIR/$INFRA_SRC/compose.yml" "$STACK_PROD_DIR/compose.yml"
      fi
    - |
      cat > "$STACK_PROD_DIR/.env.deploy" <<EOF
      SVEX_IMAGE=${CI_REGISTRY_IMAGE}/svex:${CI_COMMIT_SHA}
      DOCS_IMAGE=${CI_REGISTRY_IMAGE}/docs:${CI_COMMIT_SHA}
      CI_COMMIT_SHA=${CI_COMMIT_SHA}
      CI_PIPELINE_ID=${CI_PIPELINE_ID}
      EOF

🚀@svelte-excalidraw/PROD/stack:
  extends: .prod-compose-up
  stage: deploy
  needs: [📦@svelte-excalidraw/PROD/_prepare, build-docker-docs, build-docker-svex]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    STACK_DIR: $STACK_PROD_DIR
  environment:
    name: PROD/svelte-excalidraw/stack
    url: https://svex.tips.dev/
    action: start
