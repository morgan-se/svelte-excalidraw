# svelte-excalidraw: npm publish + GitLab images + PROD on prod1
# Registry tags: tips-framework style — single ci-$CI_PIPELINE_ID per pipeline (not commit SHA).
# PROD deploy runs on prod-1 shell runner (docker + traefik `frontend` live there), not runner0.
#
# Stages: deploy before publish — ship main first; tag/npm release when you’re ready.
#
# Shell + nvm (tips-framework style): same pattern as .fmw-build-docker-login — `. $HOME/.nvm/nvm.sh`
# before npm. Earlier pain was NOT “nvm is wrong”, it was:
#   - extends + child before_script replaced the template’s before_script (nvm never ran).
#   - optional: parallel jobs sharing ~/.nvm → tar races / “Text file busy” (fmw often builds in Docker).
#   - runner set -eo pipefail + nvm.sh internals → silent exit unless you relax around source (if it recurs).
#   - treating `. nvm.sh || exit 1` as failure — nvm.sh can leave $? != 0 even when nvm loaded.

stages:
  - build
  - docker
  - deploy
  - publish

variables:
  NPM_CONFIG_CACHE: "${CI_PROJECT_DIR}/.npm-cache"
  # Image repo roots (build -t … only). Do not use for compose: untagged values become :latest in shell env and override .env.deploy.
  DOCS_IMAGE: $CI_REGISTRY_IMAGE/docs
  SVEX_IMAGE: $CI_REGISTRY_IMAGE/svex
  # PROD stack dir on prod-1 host (prepare + compose up). runner0 only builds & pushes images.
  STACK_PROD_DIR: "/docker/svex"
  STACK_COMPOSE_SERVICES: "svex docs"
  INFRA_SRC: "docker/prod"

# cd STACK_DIR, login registry, compose pull/up (tags from .env.deploy). tags: set on job — use prod-1 for PROD stack.
.prod-compose-up:
  script:
    - |
      set -eu
      cd "$STACK_DIR"
      # GitLab job exports DOCS_IMAGE/SVEX_IMAGE without tag → compose would resolve :latest over --env-file
      unset DOCS_IMAGE SVEX_IMAGE || true
      test -f .env.deploy || { echo "ERROR: missing .env.deploy in $STACK_DIR (run PROD/_prepare first)"; exit 1; }
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      if [ -f docker-compose.yml ]; then
        COMPOSE_FILE=docker-compose.yml
      elif [ -f compose.yml ]; then
        COMPOSE_FILE=compose.yml
      else
        echo "ERROR: $STACK_DIR must contain docker-compose.yml or compose.yml"
        exit 1
      fi
      docker compose -f "$COMPOSE_FILE" --env-file .env.deploy pull $STACK_COMPOSE_SERVICES
      docker compose -f "$COMPOSE_FILE" --env-file .env.deploy up -d --remove-orphans $STACK_COMPOSE_SERVICES

# ----------------- BUILD -----------------
# Shell executor ignores `image:` — load nvm like tips-framework, then npm.
build:
  stage: build
  image: node:24
  tags:
    - "name:runner0"
    - "exec:shell"
  cache:
    key:
      files:
        - package-lock.json
      prefix: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm-cache
      - packages/svelte-excalidraw/dist
      - apps/docs/build
      - apps/docs/.svelte-kit
      - apps/svex/build
      - apps/svex/.svelte-kit
  before_script:
    - |
      cd "${CI_PROJECT_DIR:-$PWD}"
      . "$HOME/.nvm/nvm.sh"
      npm ci
  script:
    - |
      cd "${CI_PROJECT_DIR:-$PWD}"
      . "$HOME/.nvm/nvm.sh"
      npm run build
  artifacts:
    paths:
      - packages/svelte-excalidraw/dist
      - apps/docs/build
      - apps/svex/build
    expire_in: 1 day

# ----------------- PUBLISH (npm, public registry) -----------------
# Only on release tags — not on every main push (avoids "version already exists").
# Flow: bump packages/svelte-excalidraw version on main → tag → push tag:
#   git tag v0.0.9 && git push origin v0.0.9
# Requires NPM_TOKEN. Tag pipeline: build then this job (deploy already happened on main push).
publish-npm-release:
  stage: publish
  image: node:24
  tags:
    - "name:runner0"
    - "exec:shell"
  needs: [build]
  before_script:
    - |
      cd "${CI_PROJECT_DIR:-$PWD}"
      . "$HOME/.nvm/nvm.sh"
      npm ci
  script:
    - |
      cd "${CI_PROJECT_DIR:-$PWD}"
      . "$HOME/.nvm/nvm.sh"
      echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
      npm publish -w svelte-excalidraw --access public
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+(-.+)?$/ # e.g. v0.0.9 or 0.0.9

# dev → GitLab Package Registry (tag dev). Uses CI_JOB_TOKEN.
publish-npm-dev:
  stage: publish
  image: node:24
  tags:
    - "name:runner0"
    - "exec:shell"
  needs: [build]
  before_script:
    - |
      cd "${CI_PROJECT_DIR:-$PWD}"
      . "$HOME/.nvm/nvm.sh"
      npm ci
  script:
    - |
      cd "${CI_PROJECT_DIR:-$PWD}"
      . "$HOME/.nvm/nvm.sh"
      echo "registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/" >> .npmrc
      echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
      npm publish -w svelte-excalidraw --access public --tag dev
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ----------------- DOCKER (GitLab registry only) -----------------
.docker-build:
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # Shell runner: docs + svex run in parallel → both used ~/.docker/config.json → login/push race → random unauthorized on one image
    DOCKER_CONFIG: "${CI_PROJECT_DIR}/.docker-ci"
  tags:
    - "name:runner0"
    - "exec:shell"
  before_script:
    - mkdir -p "$DOCKER_CONFIG"
    # CI_REGISTRY_PASSWORD is the job token; use stdin (GitLab docs).
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build-docker-docs:
  extends: .docker-build
  stage: docker
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - docker build -t $DOCS_IMAGE:ci-$CI_PIPELINE_ID -f apps/docs/Dockerfile .
    - docker push $DOCS_IMAGE:ci-$CI_PIPELINE_ID

build-docker-svex:
  extends: .docker-build
  stage: docker
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - docker build -t $SVEX_IMAGE:ci-$CI_PIPELINE_ID -f apps/svex/Dockerfile .
    - docker push $SVEX_IMAGE:ci-$CI_PIPELINE_ID

# ----------------- DEPLOY (PROD / main only) -----------------
# One compose on prod; `compose up -d` only recreates a service when its image/config actually changes.

📦@svelte-excalidraw/PROD/_prepare:
  stage: deploy
  tags:
    - name:prod-1
    - exec:shell
  needs: [build-docker-docs, build-docker-svex]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: PROD/svelte-excalidraw
    url: https://svex.tips.dev/
    action: prepare
  script:
    - test -d "$CI_PROJECT_DIR/$INFRA_SRC" || (echo "Missing $INFRA_SRC" && exit 1)
    - test -f "$CI_PROJECT_DIR/$INFRA_SRC/compose.yml" || (echo "Missing $INFRA_SRC/compose.yml" && exit 1)
    - mkdir -p "$STACK_PROD_DIR"
    - |
      if command -v rsync >/dev/null 2>&1; then
        rsync -av "$CI_PROJECT_DIR/$INFRA_SRC/" "$STACK_PROD_DIR/" \
          --exclude 'data' --exclude '.env.deploy' \
          --exclude '*.sqlite' --exclude '*.sqlite-*'
      else
        echo "rsync not found; copying compose.yml only"
        cp -f "$CI_PROJECT_DIR/$INFRA_SRC/compose.yml" "$STACK_PROD_DIR/compose.yml"
      fi
    - |
      cat > "$STACK_PROD_DIR/.env.deploy" <<EOF
      SVEX_IMAGE=${CI_REGISTRY_IMAGE}/svex:ci-${CI_PIPELINE_ID}
      DOCS_IMAGE=${CI_REGISTRY_IMAGE}/docs:ci-${CI_PIPELINE_ID}
      DOCKER_TAG=ci-${CI_PIPELINE_ID}
      CI_COMMIT_SHA=${CI_COMMIT_SHA}
      CI_PIPELINE_ID=${CI_PIPELINE_ID}
      EOF

🚀@svelte-excalidraw/PROD/stack:
  extends: .prod-compose-up
  stage: deploy
  tags:
    - name:prod-1
    - exec:shell
  needs: [📦@svelte-excalidraw/PROD/_prepare, build-docker-docs, build-docker-svex]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    STACK_DIR: $STACK_PROD_DIR
  environment:
    name: PROD/svelte-excalidraw/stack
    url: https://svex.tips.dev/
    action: start
