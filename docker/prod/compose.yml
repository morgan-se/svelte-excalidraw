# Single stack: svex + docs. Deployed to /docker/svex by CI (see README.md)
name: svelte-excalidraw

services:
  svex:
    image: ${SVEX_IMAGE}
    environment:
      SVEX_CONFIG_JSON: |
        {
          "local": {"enabled": true},
          "ephemeral": {"enabled": true, "ttlHours": 48, "createAllowedFor": "guest"},
          "workspace": {"enabled": true, "createAllowedFor": "trusted", "selfHostedHint": true}
        }
    labels:
      traefik.enable: "true"
      traefik.http.routers.svex.entrypoints: HTTPS
      traefik.http.routers.svex.rule: Host(`svex.tips.dev`)
      traefik.http.routers.svex.service: svex
      traefik.http.routers.svex.tls: "true"
      traefik.http.services.svex.loadbalancer.server.port: "3000"
    networks:
      frontend: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: svex-data
        target: /app/data
        volume: {}

  docs:
    image: ${DOCS_IMAGE}
    labels:
      traefik.enable: "true"
      traefik.http.routers.svelte-excalidraw.entrypoints: HTTPS
      traefik.http.routers.svelte-excalidraw.rule: Host(`svelte-excalidraw.tips.dev`)
      traefik.http.routers.svelte-excalidraw.service: svelte-excalidraw
      traefik.http.routers.svelte-excalidraw.tls: "true"
      traefik.http.services.svelte-excalidraw.loadbalancer.server.port: "3000"
    networks:
      frontend: null
    restart: unless-stopped

networks:
  frontend:
    name: frontend
    external: true

volumes:
  svex-data:
    name: svex_svex-data
