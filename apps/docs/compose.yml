# Run from repo root: docker compose -f apps/docs/compose.yml up -d
services:
  docs:
    image: tips-services/svelte-excalidraw-docs
    build:
      context: ../..
      dockerfile: apps/docs/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Required for remote functions: server must know its public URL so Origin matches.
      # Override with your domain when deploying (e.g. ORIGIN=https://docs.example.com)
      ORIGIN: http://localhost:3000
    restart: unless-stopped
